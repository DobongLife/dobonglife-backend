name: GitHub 이슈 → Jira 이슈 생성 및 브랜치 자동화

on:
  issues:
    types:
      - opened

jobs:
  create-jira-and-branch:
    name: Jira Task 생성 및 브랜치 생성
    runs-on: ubuntu-latest
    steps:
      - name: develop 브랜치 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: develop
          # 핵심: PAT(GIT_TOKEN)를 사용해야 이 액션이 푸시한 커밋/브랜치가 다음 CI/CD를 트리거합니다.
          token: ${{ secrets.GIT_TOKEN }}

      # Github 이슈 마크다운을 Jira 문법으로 변환
      - name: Convert Markdown to Jira
        uses: peter-evans/jira2md@v1
        id: md2jira
        with:
          input-text: |
            ### Github Issue Link
            - ${{ github.event.issue.html_url }}

            ${{ github.event.issue.body }}
          mode: md2jira

      - name: 이슈 타입 및 제목 추출
        id: parse_issue
        run: |
          title="${{ github.event.issue.title }}"
          # [Type] 형태에서 type 추출 (소문자 변환)
          issue_type=$(echo "$title" | sed -n 's/^\[\([^]]*\)\].*/\1/p' | tr '[:upper:]' '[:lower:]' | src/xargs echo -n)
          # [Type] 제거 후 순수 제목 추출
          title_without_type=$(echo "$title" | sed 's/^\[[^]]*\] //')
          
          # 기본값 설정 (타입이 없을 경우 대비)
          if [ -z "$issue_type" ]; then issue_type="feat"; fi
          
          echo "issue_type=$issue_type" >> $GITHUB_OUTPUT
          echo "converted_title=[BE/$issue_type] $title_without_type" >> $GITHUB_OUTPUT

      - name: Jira description JSON 이스케이프
        id: escape_description
        run: |
          {
            echo "escaped_description<<EOF"
            echo '${{ steps.md2jira.outputs.output-text }}' | jq -R -s .
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Jira Task 생성
        id: create_jira_task
        uses: fjogeleit/http-request-action@v1
        with:
          url: '${{ secrets.JIRA_BASE_URL }}/rest/api/2/issue'
          method: 'POST'
          username: '${{ secrets.JIRA_USER_EMAIL }}'
          password: '${{ secrets.JIRA_API_TOKEN }}'
          customHeaders: '{"Content-Type": "application/json"}'
          data: |
            {
              "fields": {
                "project": { "key": "${{ secrets.JIRA_PROJECT_KEY }}" },
                "issuetype": { "name": "Task" },
                "summary": "${{ steps.parse_issue.outputs.converted_title }}",
                "description": ${{ steps.escape_description.outputs.escaped_description }}
              }
            }

      - name: Jira task 키 추출
        id: extract_jira_task_key
        run: |
          task_key=$(echo '${{ steps.create_jira_task.outputs.response }}' | jq -r '.key')
          echo "task_key=$task_key" >> $GITHUB_OUTPUT

      - name: 브랜치 생성 및 푸시
        run: |
          # Git 사용자 설정
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 브랜치명 조합
          BRANCH_NAME="${{ steps.parse_issue.outputs.issue_type }}/${{ steps.extract_jira_task_key.outputs.task_key }}"
          
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"

      - name: 담당자 할당 및 안내 댓글 작성
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'add-assignees, create-comment'
          token: ${{ secrets.GIT_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          assignees: ${{ github.event.issue.user.login }}
          body: |
            ## ✅ 작업 준비 완료
            
            🪾 **생성된 브랜치**: `${{ steps.parse_issue.outputs.issue_type }}/${{ steps.extract_jira_task_key.outputs.task_key }}`
            🔗 **Jira 티켓**: [${{ steps.extract_jira_task_key.outputs.task_key }}](${{ secrets.JIRA_BASE_URL }}/browse/${{ steps.extract_jira_task_key.outputs.task_key }})
            
            ⌨️ **로컬 작업 시작 명령어**:
            ```bash
            git fetch origin && git checkout ${{ steps.parse_issue.outputs.issue_type }}/${{ steps.extract_jira_task_key.outputs.task_key }}
            ```