name: GitHub 이슈 → Jira 이슈 생성 및 브랜치 자동화

on:
  issues:
    types:
      - opened

jobs:
  create-jira-and-branch:
    name: Jira Task 및 PR 생성
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write
      contents: write

    steps:
      - name: develop 브랜치 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Github 이슈 마크다운을 Jira 마크다운으로 변환
        uses: peter-evans/jira2md@v1
        id: md2jira
        with:
          input-text: |
            ### Github Issue Link
            - ${{ github.event.issue.html_url }}

            ${{ github.event.issue.body }}
          mode: md2jira

      - name: 이슈 타입 및 제목 추출
        id: info
        run: |
          TITLE="${{ github.event.issue.title }}"
          # [feat] -> feat 추출
          TYPE=$(echo "$TITLE" | sed -n 's/^\[\([^]]*\)\].*/\1/p' | tr '[:upper:]' '[:lower:]')
          # 만약 추출 실패 시 기본값 feat 사용
          if [ -z "$TYPE" ]; then TYPE="feat"; fi
          # [feat] 제거된 순수 제목
          CLEAN_TITLE=$(echo "$TITLE" | sed 's/^\[[^]]*\] //')
          
          echo "issue_type=$TYPE" >> $GITHUB_OUTPUT
          echo "converted_title=[BE/$TYPE] $CLEAN_TITLE" >> $GITHUB_OUTPUT

      - name: Jira description 이스케이프 처리
        id: escape_description
        run: |
          {
            echo "escaped_description<<EOF"
            echo '${{ steps.md2jira.outputs.output-text }}' | jq -R -s .
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Jira Task 생성
        id: create_jira_task
        uses: fjogeleit/http-request-action@v1
        with:
          url: '${{ secrets.JIRA_BASE_URL }}/rest/api/2/issue'
          method: 'POST'
          username: '${{ secrets.JIRA_USER_EMAIL }}'
          password: '${{ secrets.JIRA_API_TOKEN }}'
          customHeaders: '{"Content-Type": "application/json"}'
          data: |
            {
              "fields": {
                "project": { "key": "${{ secrets.JIRA_PROJECT_KEY }}" },
                "issuetype": { "name": "Task" },
                "summary": "${{ steps.info.outputs.converted_title }}",
                "description": ${{ steps.escape_description.outputs.escaped_description }}
              }
            }

      - name: Jira 키 추출
        id: jira_key
        run: |
          KEY=$(echo '${{ steps.create_jira_task.outputs.response }}' | jq -r '.key')
          echo "task_key=$KEY" >> $GITHUB_OUTPUT

      - name: 브랜치 생성 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH_NAME="${{ steps.info.outputs.issue_type }}/${{ steps.jira_key.outputs.task_key }}"
          git checkout -b $BRANCH_NAME
          git push origin $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV

      - name: PR 생성 및 이슈에 댓글 추가
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GIT_TOKEN }}
          script: |
            const branch_name = process.env.branch_name;
            const task_key = "${{ steps.jira_key.outputs.task_key }}";
            const jira_url = `${{ secrets.JIRA_BASE_URL }}/browse/${task_key}`;
            
            // 1. Pull Request 생성 (develop 브랜치로)
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${{ steps.info.outputs.converted_title }}`,
              head: branch_name,
              base: 'develop',
              body: `## 관련 이슈\n- Jira 티켓: [${task_key}](${jira_url})\n- GitHub 이슈: #${{ github.event.issue.number }}`
            });

            // 2. 원래 열려있던 GitHub 이슈에 댓글 추가
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🪾 **새 브랜치가 생성되었습니다**: \`${branch_name}\`
            🔗 **연결된 Jira Task**: [${task_key}](${jira_url})
            🚀 **생성된 Pull Request**: ${pr.data.html_url}
            
            **작업 시작 명령어**:
            \`\`\`bash
            git checkout develop && git pull && git checkout -b ${branch_name} origin/${branch_name}
            \`\`\``
            });