server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_SCHEMA:dobonglife_user}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    show-sql: true

jwt:
  secret: ${JWT_SECRET_KEY:default-secret-key-for-local-testing-only-change-in-production}
  access:
    expiration: ${JWT_ACCESS_EXPIRED_IN:3600000}
    header: Authorization
  refresh:
    expiration: ${JWT_REFRESH_EXPIRED_IN:604800000}
    header: Authorization-refresh

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}

# service URLs for cross-service calls
services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8082}
  commerce-service:
    url: ${COMMERCE_SERVICE_URL:http://localhost:8083}
  content-service:
    url: ${CONTENT_SERVICE_URL:http://localhost:8084}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# Mail (for user service)
spring.mail:
  host: smtp.gmail.com
  port: 587
  username: ${MAIL_ADDRESS:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: true
    mail.smtp.timeout: 5000
    mail.smtp.starttls.enable: true

cloud:
  aws:
    credentials:
      accessKey: ${AWS_ACCESS_KEY:}
      secretKey: ${AWS_SECRET_KEY:}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET_NAME:}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
