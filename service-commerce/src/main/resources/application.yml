server:
  port: 8083

spring:
  application:
    name: commerce-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/${DB_SCHEMA:dobonglife_commerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET_KEY:default-secret-key-for-local-testing-only-change-in-production}
  access:
    expiration: ${JWT_ACCESS_EXPIRED_IN:3600000}
    header: Authorization
  refresh:
    expiration: ${JWT_REFRESH_EXPIRED_IN:604800000}
    header: Authorization-refresh

services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

cloud:
  aws:
    credentials:
      accessKey: ${AWS_ACCESS_KEY:}
      secretKey: ${AWS_SECRET_KEY:}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET_NAME:}

open-api:
  secret-key: ${OPEN_API_SECRET_KEY:}
  base-url: ${OPEN_API_BASE_URL:https://api.odcloud.kr/api/nts-businessman/v1}

naver:
  map:
    base-url: ${NAVER_MAP_BASE_URL:https://naveropenapi.apigw.ntruss.com/map-geocode/v2}
    client-id: ${NAVER_MAP_CLIENT_ID:}
    client-secret: ${NAVER_MAP_CLIENT_SECRET:}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  adminsdk:
    account:
      path: ${FIREBASE_ADMINSDK_ACCOUNT_PATH:/tmp/dummy-firebase.json}
      enabled: ${FIREBASE_ENABLED:false}
