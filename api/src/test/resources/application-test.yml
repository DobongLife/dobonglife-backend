spring:

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        dialect: org.hibernate.dialect.H2Dialect
  
  h2:
    console:
      enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-test-google-client-id
            client-secret: dummy-test-google-secret
            redirect-uri: http://localhost:8080/login/oauth2/code/google
          kakao:
            client-id: dummy-test-kakao-client-id
            client-secret: dummy-test-kakao-secret
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            client-name: kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope: profile_nickname, profile_image, account_email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: test_secret_key_for_dobonglife_ci_1234567890
  access:
    expiration: 3600
    header: Authorization
  refresh:
    expiration: 604800
    header: Authorization-refresh

kakao:
  admin-key: test-kakao-admin-key

apple:
  client-id: com.umust.dobonglife.test
  team-id: test-team-id
  key-id: test-key-id
  private-key-path: /tmp/test-apple-key.p8

cloud:
  aws:
    credentials:
      accessKey: test_access_key
      secretKey: test_secret_key
    region:
      static: region
    s3:
      bucket: bucket

cors:
  allowed-origins: http://localhost:3000

swagger:
  server:
    local-url: http://localhost:8080
    global-url: http://localhost:8080

open-api:
  secret-key: test-open-api-secret-key
  base-url: https://api.odcloud.kr/api

naver:
  map:
    base-url: https://naveropenapi.apigw.ntruss.com
    client-id: test-naver-client-id
    client-secret: test-naver-client-secret

firebase:
  adminsdk:
    account:
      path: src/main/resources/firebase/your-key.json