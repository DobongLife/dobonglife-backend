spring:
  application:
    name: dobonglife
  profiles:
    group:
      local: local-db, common
      prod: prod-db, common
    active: local

  config:
    activate:
      on-profile: common
    import: optional:file:./.env[.properties]

  web:
    resources:
      add-mappings: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope: profile, email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: kakao
            client-authentication-method: client_secret_post
            redirect-uri: ${KAKAO_REDIRECT_URI}
            authorization-grant-type: authorization_code
            scope: profile_nickname, profile_image, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_ADDRESS}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.timeout: 5000
      mail.smtp.starttls.enable: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs/swagger
    urls-primary-name: Springdoc
    urls:
      - name: Springdoc
        url: /v3/api-docs
      - name: RestDocs
        url: /docs/openapi3.json
jwt:
  secret: ${JWT_SECRET_KEY}
  access:
    expiration: ${JWT_ACCESS_EXPIRED_IN}
    header: Authorization
  refresh:
    expiration: ${JWT_REFRESH_EXPIRED_IN}
    header: Authorization-refresh

kakao:
  admin-key: ${KAKAO_ADMIN_KEY}

apple:
  client-id: ${APPLE_CLIENT_ID}
  team-id: ${APPLE_TEAM_ID}
  key-id: ${APPLE_KEY_ID}
  private-key-path: ${APPLE_PRIVATE_KEY_PATH}

service:
  commerce:
    url: ${COMMERCE_SERVICE_URL:http://localhost:8082}
  content:
    url: ${CONTENT_SERVICE_URL:http://localhost:8081}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8083}
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8084}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}

swagger:
  server:
    local-url: ${SWAGGER_LOCAL_URL:http://localhost:8080}
    global-url: ${SWAGGER_GLOBAL_URL:https://api.dobonglife.co.kr}

internal:
  api-key: ${INTERNAL_API_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

open-api:
  secret-key: ${OPEN_API_SECRET_KEY}
  base-url: ${OPEN_API_BASE_URL:https://api.odcloud.kr/api/nts-businessman/v1/}

naver:
  map:
    base-url: ${NAVER_MAP_BASE_URL:https://naveropenapi.apigw.ntruss.com}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
    instances:
      user-service:
        base-config: default
      auth-service:
        base-config: default
      commerce-service:
        base-config: default
      content-service:
        base-config: default

cloud:
  aws:
    credentials:
      accessKey: ${AWS_ACCESS_KEY}
      secretKey: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION}
    s3:
      bucket: ${S3_BUCKET_NAME}
