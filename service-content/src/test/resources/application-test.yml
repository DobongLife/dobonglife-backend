spring:
  mail:
    host: localhost
    port: 25
    properties:
      mail.smtp.auth: false
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: false
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-secret
            redirect-uri: http://localhost:8084/login/oauth2/code/google
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-secret
            client-name: kakao
            client-authentication-method: client_secret_post
            redirect-uri: http://localhost:8084/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            scope: profile_nickname, profile_image, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: test_secret_key_for_dobonglife_ci_1234567890
  access:
    expiration: 3600000
    header: Authorization
  refresh:
    expiration: 604800000
    header: Authorization-refresh

cors:
  allowed-origins: http://localhost:3000

cloud:
  aws:
    credentials:
      accessKey: test_access_key
      secretKey: test_secret_key
    region:
      static: ap-northeast-2
    s3:
      bucket: test-bucket

firebase:
  enabled: false
  adminsdk:
    account:
      path: /tmp/test-firebase-key.json
      enabled: false
