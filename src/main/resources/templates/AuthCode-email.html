<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도봉라이프 인증번호</title>
</head>
<body style="margin: 0; padding: 0; background-color: #F9FAFB; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;">
<table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #F9FAFB; padding: 40px 20px;">
    <tr>
        <td align="center">
            <table width="100%" max-width="500" border="0" cellspacing="0" cellpadding="0" style="background-color: #FFFFFF; border: 1px solid #DBDBDB; border-radius: 16px; overflow: hidden; max-width: 500px;">

                <tr>
                    <td style="padding: 32px 32px 20px 32px;">
                        <div style="color: #1A2066; font-size: 24px; font-weight: bold; margin-bottom: 8px;">도봉라이프(DobongLife)</div>
                        <div style="color: #535BD2; font-size: 14px; font-weight: 600;">스토리가 있는 여행</div>
                    </td>
                </tr>

                <tr>
                    <td style="padding: 0 32px 32px 32px;">
                        <div style="height: 1px; background-color: #F3F4F6; margin-bottom: 32px;"></div>

                        <h1 style="font-size: 20px; font-weight: bold; color: #121212; margin: 0 0 16px 0; line-height: 1.4;">이메일 인증을<br/>완료해주세요.</h1>

                        <p style="font-size: 14px; color: #6B6B6B; line-height: 1.6; margin: 0 0 32px 0;">
                            안녕하세요! 도봉라이프를 이용해 주셔서 감사합니다.<br/>
                            아래의 인증번호 6자리를 앱 화면에 입력하여 인증 절차를 마무리해 주세요.
                        </p>

                        <div style="background-color: #EFF0FB; border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 32px;">
                            <div style="font-size: 12px; color: #535BD2; font-weight: 600; margin-bottom: 8px; letter-spacing: 1px;">인증번호 (Verification Code)</div>
                            <div style="font-size: 32px; font-weight: bold; color: #1A2066; letter-spacing: 8px;"th:text="${code}"></div>
                        </div>

                        <p style="font-size: 12px; color: #BABABA; line-height: 1.5; margin: 0;">
                            * 인증번호는 발송 후 5분 동안만 유효합니다.<br/>
                            * 본인이 요청하지 않았는데 메일을 받으셨다면, 무시하셔도 됩니다.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="background-color: #FAFAFA; padding: 24px 32px; text-align: left;">
                        <div style="font-size: 12px; color: #6B6B6B; line-height: 1.5;">
                            본 메일은 발신 전용입니다.<br/>
                            © 도봉라이프. All rights reserved.
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
