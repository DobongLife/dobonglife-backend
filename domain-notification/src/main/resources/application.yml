server:
  port: 8085

spring:
  application:
    name: domain-notification
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${NOTIFICATION_DATASOURCE_URL:${LOCAL_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/dobonglife_notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}}}
    username: ${NOTIFICATION_DATASOURCE_USERNAME:${LOCAL_DATASOURCE_USERNAME:${DB_USERNAME:root}}}
    password: ${NOTIFICATION_DATASOURCE_PASSWORD:${LOCAL_DATASOURCE_PASSWORD:${DB_PASSWORD:}}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        allowPublicKeyRetrieval: true
        useSSL: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
