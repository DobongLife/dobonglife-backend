server:
  port: 8081

spring:
  application:
    name: domain-content
  datasource:
    url: jdbc:mysql://localhost:3306/dobonglife_content?useSSL=false&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
