server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_SCHEMA:dobonglife_auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            redirect-uri: ${GOOGLE_REDIRECT_URI:}
            scope: profile, email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-name: kakao
            client-authentication-method: client_secret_post
            redirect-uri: ${KAKAO_REDIRECT_URI:}
            authorization-grant-type: authorization_code
            scope: profile_nickname, profile_image, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET_KEY:default-secret-key-for-local-testing-only-change-in-production}
  access:
    expiration: ${JWT_ACCESS_EXPIRED_IN:3600000}
    header: Authorization
  refresh:
    expiration: ${JWT_REFRESH_EXPIRED_IN:604800000}
    header: Authorization-refresh

kakao:
  admin-key: ${KAKAO_ADMIN_KEY:}

apple:
  client-id: ${APPLE_CLIENT_ID:}
  team-id: ${APPLE_TEAM_ID:}
  key-id: ${APPLE_KEY_ID:}
  private-key-path: ${APPLE_PRIVATE_KEY_PATH:}

services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

cloud:
  aws:
    credentials:
      accessKey: ${AWS_ACCESS_KEY:}
      secretKey: ${AWS_SECRET_KEY:}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET_NAME:}

open-api:
  secret-key: ${OPEN_API_SECRET_KEY:}
  base-url: ${OPEN_API_BASE_URL:https://api.odcloud.kr/api/nts-businessman/v1}

naver:
  map:
    base-url: ${NAVER_MAP_BASE_URL:https://naveropenapi.apigw.ntruss.com/map-geocode/v2}
    client-id: ${NAVER_MAP_CLIENT_ID:}
    client-secret: ${NAVER_MAP_CLIENT_SECRET:}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  adminsdk:
    account:
      path: ${FIREBASE_ADMINSDK_ACCOUNT_PATH:/tmp/dummy-firebase.json}
      enabled: ${FIREBASE_ENABLED:false}
