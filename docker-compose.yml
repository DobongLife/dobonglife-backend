version: "3.8"

services:
  # ── Databases ──
  mysql-user:
    image: mysql:8.0
    container_name: dobonglife-mysql-user
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: dobonglife_user
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - mysql-user-data:/var/lib/mysql
    networks:
      - dobonglife-msa
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-auth:
    image: mysql:8.0
    container_name: dobonglife-mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: dobonglife_auth
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: Asia/Seoul
    ports:
      - "3308:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql
    networks:
      - dobonglife-msa
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-commerce:
    image: mysql:8.0
    container_name: dobonglife-mysql-commerce
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: dobonglife_commerce
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: Asia/Seoul
    ports:
      - "3309:3306"
    volumes:
      - mysql-commerce-data:/var/lib/mysql
    networks:
      - dobonglife-msa
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-content:
    image: mysql:8.0
    container_name: dobonglife-mysql-content
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: dobonglife_content
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: Asia/Seoul
    ports:
      - "3310:3306"
    volumes:
      - mysql-content-data:/var/lib/mysql
    networks:
      - dobonglife-msa
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (공유) ──
  redis:
    image: redis:7.2-alpine
    container_name: dobonglife-redis-msa
    ports:
      - "6379:6379"
    volumes:
      - redis-msa-data:/data
    networks:
      - dobonglife-msa
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Services ──
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        JAR_FILE: service-user/build/libs/service-user-0.0.1-SNAPSHOT.jar
    container_name: dobonglife-user-service
    environment:
      TZ: Asia/Seoul
      DB_HOST: mysql-user
      DB_PORT: 3306
      DB_SCHEMA: dobonglife_user
      DB_USERNAME: app
      DB_PASSWORD: app
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:8082
      COMMERCE_SERVICE_URL: http://commerce-service:8083
      CONTENT_SERVICE_URL: http://content-service:8084
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-key-change-me-in-production}
      # Mail
      MAIL_ADDRESS: ${MAIL_ADDRESS:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # AWS S3
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      # Firebase
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_ADMINSDK_ACCOUNT_PATH: ${FIREBASE_ADMINSDK_ACCOUNT_PATH:-}
      OPEN_API_SECRET_KEY: ${OPEN_API_SECRET_KEY:-}
      OPEN_API_BASE_URL: ${OPEN_API_BASE_URL:-https://api.odcloud.kr/api/nts-businessman/v1}
      NAVER_MAP_BASE_URL: ${NAVER_MAP_BASE_URL:-https://naveropenapi.apigw.ntruss.com/map-geocode/v2}
      NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID:-}
      NAVER_MAP_CLIENT_SECRET: ${NAVER_MAP_CLIENT_SECRET:-}
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Xmx512m
    ports:
      - "8081:8081"
    depends_on:
      mysql-user:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dobonglife-msa
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        JAR_FILE: service-auth/build/libs/service-auth-0.0.1-SNAPSHOT.jar
    container_name: dobonglife-auth-service
    environment:
      TZ: Asia/Seoul
      DB_HOST: mysql-auth
      DB_PORT: 3306
      DB_SCHEMA: dobonglife_auth
      DB_USERNAME: app
      DB_PASSWORD: app
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: http://user-service:8081
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-key-change-me-in-production}
      # OAuth2
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}
      # Apple
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY_PATH: ${APPLE_PRIVATE_KEY_PATH:-}
      # AWS S3
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      # Firebase
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_ADMINSDK_ACCOUNT_PATH: ${FIREBASE_ADMINSDK_ACCOUNT_PATH:-}
      OPEN_API_SECRET_KEY: ${OPEN_API_SECRET_KEY:-}
      OPEN_API_BASE_URL: ${OPEN_API_BASE_URL:-https://api.odcloud.kr/api/nts-businessman/v1}
      NAVER_MAP_BASE_URL: ${NAVER_MAP_BASE_URL:-https://naveropenapi.apigw.ntruss.com/map-geocode/v2}
      NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID:-}
      NAVER_MAP_CLIENT_SECRET: ${NAVER_MAP_CLIENT_SECRET:-}
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Xmx512m
    ports:
      - "8082:8082"
    depends_on:
      mysql-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dobonglife-msa
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  commerce-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        JAR_FILE: service-commerce/build/libs/service-commerce-0.0.1-SNAPSHOT.jar
    container_name: dobonglife-commerce-service
    environment:
      TZ: Asia/Seoul
      DB_HOST: mysql-commerce
      DB_PORT: 3306
      DB_SCHEMA: dobonglife_commerce
      DB_USERNAME: app
      DB_PASSWORD: app
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: http://user-service:8081
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-key-change-me-in-production}
      # AWS S3
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      # Firebase
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_ADMINSDK_ACCOUNT_PATH: ${FIREBASE_ADMINSDK_ACCOUNT_PATH:-}
      OPEN_API_SECRET_KEY: ${OPEN_API_SECRET_KEY:-}
      OPEN_API_BASE_URL: ${OPEN_API_BASE_URL:-https://api.odcloud.kr/api/nts-businessman/v1}
      NAVER_MAP_BASE_URL: ${NAVER_MAP_BASE_URL:-https://naveropenapi.apigw.ntruss.com/map-geocode/v2}
      NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID:-}
      NAVER_MAP_CLIENT_SECRET: ${NAVER_MAP_CLIENT_SECRET:-}
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Xmx512m
    ports:
      - "8083:8083"
    depends_on:
      mysql-commerce:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dobonglife-msa
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  content-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        JAR_FILE: service-content/build/libs/service-content-0.0.1-SNAPSHOT.jar
    container_name: dobonglife-content-service
    environment:
      TZ: Asia/Seoul
      DB_HOST: mysql-content
      DB_PORT: 3306
      DB_SCHEMA: dobonglife_content
      DB_USERNAME: app
      DB_PASSWORD: app
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-key-change-me-in-production}
      # AWS S3
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      # Firebase
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_ADMINSDK_ACCOUNT_PATH: ${FIREBASE_ADMINSDK_ACCOUNT_PATH:-}
      OPEN_API_SECRET_KEY: ${OPEN_API_SECRET_KEY:-}
      OPEN_API_BASE_URL: ${OPEN_API_BASE_URL:-https://api.odcloud.kr/api/nts-businessman/v1}
      NAVER_MAP_BASE_URL: ${NAVER_MAP_BASE_URL:-https://naveropenapi.apigw.ntruss.com/map-geocode/v2}
      NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID:-}
      NAVER_MAP_CLIENT_SECRET: ${NAVER_MAP_CLIENT_SECRET:-}
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Xmx512m
    ports:
      - "8084:8084"
    depends_on:
      mysql-content:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dobonglife-msa
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── API Gateway ──
  nginx:
    image: nginx:alpine
    container_name: dobonglife-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - auth-service
      - commerce-service
      - content-service
    networks:
      - dobonglife-msa

volumes:
  mysql-user-data:
  mysql-auth-data:
  mysql-commerce-data:
  mysql-content-data:
  redis-msa-data:

networks:
  dobonglife-msa:
    driver: bridge
